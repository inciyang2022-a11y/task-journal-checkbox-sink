name: Bug report
description: Report a reproducible problem with the plugin.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the plugin. Remove all private information from note examples before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version and platform
      placeholder: Obsidian 1.x.x on Windows, Android, or iOS
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: View
      options:
        - Editing view
        - Reading view
        - Both
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact actions that cause the problem.
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Minimal Markdown example
      description: Remove names, journal content, and other private data.
      render: markdown
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal and sensitive information from this report.
          required: true
